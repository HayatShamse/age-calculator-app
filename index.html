<title>Age Calculator App</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,800;1,800&display=swap"
  rel="stylesheet"
/>

<style>
  body {
    font-family: "Poppins", sans-serif;
  }

  .result-number {
    animation: appear 0.7s ease;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: translateY(15px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<script src="script.js" defer></script>
<!-- Main Container -->
<main
  class="bg-white w-full max-w-[840px] p-6 sm:p-14 rounded-3xl rounded-br-[150px] sm:rounded-br-[190px]"
>
  <!-- Form -->
  <form id="age-form">
    <!-- Input Fields -->
    <div class="flex gap-3 sm:gap-7">
      <!-- Day -->
      <div class="flex flex-col gap-2 w-1/3 sm:w-40" id="day-field">
        <label
          for="day"
          class="text-gray-500 text-xs sm:text-sm font-bold tracking-[3px]"
        >
          DAY
        </label>

        <input
          type="number"
          id="day"
          placeholder="DD"
          class="w-full border border-gray-300 rounded-lg p-3 sm:p-4 text-xl sm:text-3xl font-bold outline-none focus:border-purple-600"
        />

        <small class="error text-red-500 text-[10px] sm:text-xs italic"></small>
      </div>

      <!-- Month -->
      <div class="flex flex-col gap-2 w-1/3 sm:w-40" id="month-field">
        <label
          for="month"
          class="text-gray-500 text-xs sm:text-sm font-bold tracking-[3px]"
        >
          MONTH
        </label>

        <input
          type="number"
          id="month"
          placeholder="MM"
          class="w-full border border-gray-300 rounded-lg p-3 sm:p-4 text-xl sm:text-3xl font-bold outline-none focus:border-purple-600"
        />

        <small class="error text-red-500 text-[10px] sm:text-xs italic"></small>
      </div>

      <!-- Year -->
      <div class="flex flex-col gap-2 w-1/3 sm:w-40" id="year-field">
        <label
          for="year"
          class="text-gray-500 text-xs sm:text-sm font-bold tracking-[3px]"
        >
          YEAR
        </label>

        <input
          type="number"
          id="year"
          placeholder="YYYY"
          class="w-full border border-gray-300 rounded-lg p-3 sm:p-4 text-xl sm:text-3xl font-bold outline-none focus:border-purple-600"
        />

        <small class="error text-red-500 text-[10px] sm:text-xs italic"></small>
      </div>
    </div>

    <!-- Divider and Button -->
    <div class="relative flex items-center my-10 sm:my-12">
      <div class="w-full h-px bg-gray-300"></div>

      <button
        type="submit"
        aria-label="Calculate age"
        class="absolute right-1/2 translate-x-1/2 sm:right-0 sm:translate-x-0 bg-purple-600 hover:bg-black transition duration-300 rounded-full w-16 h-16 sm:w-24 sm:h-24 flex items-center justify-center"
      >
        <!-- Arrow Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="46"
          height="44"
          viewBox="0 0 46 44"
          fill="none"
          class="w-8 h-8 sm:w-11 sm:h-11"
        >
          <path
            d="M23 5V39M8 24L23 39L38 24"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </form>

  <!-- Results -->
  <section class="mt-8 sm:mt-12" aria-live="polite">
    <p
      class="text-5xl sm:text-8xl font-extrabold italic leading-tight tracking-tight"
    >
      <span id="years" class="text-purple-600">--</span>
      years
    </p>

    <p
      class="text-5xl sm:text-8xl font-extrabold italic leading-tight tracking-tight"
    >
      <span id="months" class="text-purple-600">--</span>
      months
    </p>

    <p
      class="text-5xl sm:text-8xl font-extrabold italic leading-tight tracking-tight"
    >
      <span id="days" class="text-purple-600">--</span>
      days
    </p>
  </section>
</main>
